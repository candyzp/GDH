name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build iOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS

      - name: Upload iOS build
        uses: actions/upload-artifact@v7
        with:
          name: GDH-iOS
          path: ${{ steps.build.outputs.build-output }}
